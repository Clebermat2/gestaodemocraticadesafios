<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo 2: Dilemas da Gestão Democrática</title>
    <style>
        :root {
            --bg-color: #eef7ff;
            --text-color: #333;
            --primary-color: #5a3e8d; /* Roxo original do Jogo 2 */
            --secondary-color: #f0ad4e;
            --accent-color: #28a745; /* Verde (Padronizado Jogo 1) */
            --error-color: #dc3545; /* Vermelho (Padronizado Jogo 1) */
            --border-color: #ccc;
            --card-bg: #ffffff;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            font-size: 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        .high-contrast {
            --bg-color: #000000;
            --text-color: #ffffff;
            --primary-color: #ffff00;
            --secondary-color: #ff9900;
            --accent-color: #00ff00;
            --error-color: #ff0000;
            --border-color: #ffffff;
            --card-bg: #222222;
        }

        .container {
            max-width: 800px;
            margin: auto;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
        }

        .accessibility-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .accessibility-controls button {
            padding: 10px 15px;
            font-size: 1em;
            cursor: pointer;
            border: 1px solid var(--primary-color);
            background-color: var(--primary-color);
            color: white;
            border-radius: 5px;
        }
        
        .accessibility-controls button:hover {
            opacity: 0.8;
        }
        
        #card-container {
            perspective: 1000px;
            /* Altura removida para se ajustar ao conteúdo dinamicamente, 
               mas mantendo min-height para estabilidade */
            min-height: 400px; 
            margin-bottom: 20px;
        }
        
        #dilemma-card {
            width: 100%;
            height: 100%;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        #dilemma-text {
            font-size: 1.2em;
            color: var(--primary-color); /* Ajustado para primária para contraste neutro inicial */
            font-weight: bold;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .options-grid button {
            padding: 15px;
            font-size: 1em;
            cursor: pointer;
            border: 1px solid var(--primary-color);
            background-color: transparent;
            color: var(--text-color);
            border-radius: 8px;
            transition: all 0.3s;
            height: 100%; /* Para alinhar alturas */
        }
        
        .options-grid button:hover {
            background-color: var(--primary-color);
            color: white;
        }
        
        #dilemma-feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            text-align: center; /* Centralizado como no Jogo 1 */
        }
        
        #next-dilemma {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1.1em;
            cursor: pointer;
            background-color: var(--secondary-color);
            color: #fff;
            border: none;
            border-radius: 5px;
            display: none;
        }

        /* Estilos do Placar Final (Idêntico ao Jogo 1) */
        .score-box {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Jogo 2: Dilemas da Gestão Democrática</h1>
        <div class="accessibility-controls">
            <button id="increase-font">Aumentar Fonte</button>
            <button id="decrease-font">Diminuir Fonte</button>
            <button id="toggle-contrast">Alto Contraste</button>
        </div>

        <div id="card-container">
            <div id="dilemma-card">
                <div>
                    <p id="dilemma-text"></p>
                </div>
                <div class="options-grid" id="dilemma-options"></div>
                
                <div id="dilemma-feedback"></div>
                <button id="next-dilemma">Próximo Dilema</button>
            </div>
        </div>

    </div>

    <script>
        const dilemmas = [
            {
                dilemma: "A escola recebeu os recursos do PDDE. Como você, gestor(a), decide onde o dinheiro será aplicado?",
                options: [
                    { text: "Decido sozinho(a) para ser mais rápido, pois conheço as necessidades da escola.", isCorrect: false },
                    { text: "Convoco o Conselho Escolar e a comunidade para uma reunião, apresento os valores e construímos juntos uma lista de prioridades.", isCorrect: true }
                ],
                feedback: "A Gestão Democrática se fortalece com a participação coletiva. Decidir em conjunto com a comunidade escolar é o caminho correto para alinhar os gastos às reais necessidades de todos. (Caderno 2, p. 12)"
            },
            {
                dilemma: "Um grupo de estudantes quer usar parte do recurso para criar um espaço de convivência, mas alguns professores acham que o dinheiro deveria ser usado apenas para materiais pedagógicos. O que fazer?",
                options: [
                    { text: "Mediar um diálogo entre estudantes e professores, buscando um consenso que contemple parte das duas propostas, se possível, e que esteja alinhado ao PPP.", isCorrect: true },
                    { text: "Ignorar a proposta dos estudantes, pois os professores têm mais experiência sobre as necessidades da escola.", isCorrect: false }
                ],
                feedback: "A mediação de conflitos e o diálogo são pilares da Gestão Democrática. Dar voz aos estudantes e buscar o consenso valoriza a participação de todos os segmentos. (Caderno 2, p. 41)"
            },
            {
                dilemma: "A escola possui estudantes com deficiência visual e precisa adquirir materiais. Qual ação é mais alinhada a uma perspectiva de inclusão e equidade?",
                options: [
                    { text: "Comprar materiais didáticos comuns para todas as turmas, pois o princípio da igualdade diz que todos devem receber o mesmo.", isCorrect: false },
                    { text: "Utilizar os recursos do PDDE para adquirir materiais em Braille, audiolivros e softwares de acessibilidade, atendendo às necessidades específicas desses estudantes.", isCorrect: true }
                ],
                feedback: "Equidade é diferente de igualdade. Uma gestão inclusiva busca oferecer recursos específicos para garantir que todos os estudantes tenham as mesmas oportunidades de aprendizagem. (Caderno 2, p. 52)"
            },
            {
                dilemma: "A prestação de contas dos recursos do PDDE foi finalizada. Qual é a próxima etapa, segundo os princípios da transparência?",
                options: [
                    { text: "Apresentar a prestação de contas em reunião aberta para toda a comunidade escolar, fixando um resumo em local visível na escola.", isCorrect: true },
                    { text: "Arquivar os documentos e enviá-los apenas à Secretaria de Educação, pois a comunidade não precisa desses detalhes.", isCorrect: false }
                ],
                feedback: "A transparência é fundamental no uso de recursos públicos. Dar publicidade à prestação de contas fortalece o controle social e a confiança da comunidade na gestão escolar. (Caderno 2, p. 35)"
            }
        ];

        let currentDilemmaIndex = 0;
        let fontSize = 16;
        let scoreCorrect = 0;
        let scoreWrong = 0;

        const body = document.body;
        const dilemmaCard = document.getElementById('dilemma-card'); // Elemento pai
        const dilemmaText = document.getElementById('dilemma-text');
        const dilemmaOptions = document.getElementById('dilemma-options');
        const dilemmaFeedback = document.getElementById('dilemma-feedback');
        const nextDilemmaBtn = document.getElementById('next-dilemma');

        document.getElementById('increase-font').addEventListener('click', () => {
            fontSize += 2;
            body.style.fontSize = `${fontSize}px`;
        });

        document.getElementById('decrease-font').addEventListener('click', () => {
            fontSize = Math.max(12, fontSize - 2);
            body.style.fontSize = `${fontSize}px`;
        });

        document.getElementById('toggle-contrast').addEventListener('click', () => {
            body.classList.toggle('high-contrast');
        });

        function loadDilemma(index) {
            const dilemma = dilemmas[index];
            dilemmaText.textContent = dilemma.dilemma;
            dilemmaOptions.innerHTML = '';
            
            // Reseta visualização
            dilemmaFeedback.style.display = 'none';
            dilemmaFeedback.textContent = '';
            nextDilemmaBtn.style.display = 'none';
            dilemmaOptions.style.display = 'grid'; // Garante que opções apareçam

            dilemma.options.forEach((option, idx) => {
                const button = document.createElement('button');
                button.textContent = option.text;
                // Passamos o índice do botão clicado para a função
                button.onclick = () => checkAnswer(idx, option.isCorrect, dilemma.feedback);
                dilemmaOptions.appendChild(button);
            });
        }

        function checkAnswer(selectedIndex, isCorrect, feedbackText) {
            const buttons = Array.from(dilemmaOptions.children);
            
            // Desabilita botões
            buttons.forEach(button => button.disabled = true);
            
            if (isCorrect) {
                // Lógica de Acerto
                scoreCorrect++;
                
                dilemmaFeedback.style.color = 'var(--accent-color)';
                dilemmaFeedback.innerHTML = `<span style="font-size:1.2em">✔️ <strong>Sua Resposta está Correta</strong></span><br><br>${feedbackText}`;
                
                // Botão verde
                buttons[selectedIndex].style.backgroundColor = 'var(--accent-color)';
                buttons[selectedIndex].style.color = 'white';
                buttons[selectedIndex].style.borderColor = 'var(--accent-color)';

            } else {
                // Lógica de Erro
                scoreWrong++;
                
                dilemmaFeedback.style.color = 'var(--error-color)';
                dilemmaFeedback.innerHTML = `<span style="font-size:1.2em">❌ <strong>Sua Resposta está Errada</strong></span><br><br>${feedbackText}`;
                
                // Botão vermelho
                buttons[selectedIndex].style.backgroundColor = 'var(--error-color)';
                buttons[selectedIndex].style.color = 'white';
                buttons[selectedIndex].style.borderColor = 'var(--error-color)';
            }
            
            dilemmaFeedback.style.display = 'block';
            nextDilemmaBtn.style.display = 'inline-block';
        }

        nextDilemmaBtn.addEventListener('click', () => {
            currentDilemmaIndex++;
            if (currentDilemmaIndex >= dilemmas.length) {
                showGameOver();
            } else {
                loadDilemma(currentDilemmaIndex);
            }
        });

        function showGameOver() {
            // Esconde elementos do jogo
            dilemmaText.style.display = 'none';
            dilemmaOptions.style.display = 'none';
            dilemmaFeedback.style.display = 'none';
            nextDilemmaBtn.style.display = 'none';

            // Usa o próprio card para mostrar o resultado
            const resultDiv = document.createElement('div');
            resultDiv.innerHTML = `
                <h2 style="color: var(--primary-color);">Fim de Jogo!</h2>
                <p>Você enfrentou todos os dilemas da Gestão Democrática.</p>
                <div class="score-box">
                    <p style="color: var(--accent-color); font-size: 1.2em;"><strong>Questões Corretas: ${scoreCorrect}</strong></p>
                    <p style="color: var(--error-color); font-size: 1.2em;"><strong>Questões Incorretas: ${scoreWrong}</strong></p>
                </div>
                <br><br>
                <button onclick="location.reload()" style="padding:12px 24px; background-color: var(--secondary-color); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em;">Jogar Novamente</button>
            `;
            
            dilemmaCard.appendChild(resultDiv);
            dilemmaCard.style.justifyContent = 'center';
            dilemmaCard.style.alignItems = 'center';
        }

        loadDilemma(currentDilemmaIndex);
    </script>

</body>
</html>
